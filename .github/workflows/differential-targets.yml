name: Differential Target Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  differential-targets:
    name: Battery + EVM (solc/Foundry) and Quint Differential Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl git

      - name: Install pinned toolchain via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Foundry (forge) and solc 0.8.24
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install solc binary
        run: |
          sudo curl -L https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -o /usr/local/bin/solc
          sudo chmod +x /usr/local/bin/solc
          solc --version

      - name: Install Quint CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint

      - name: Build Charter
        id: build
        run: lake build

      # The battery's projections gate runs the external tools too; here a missing tool is a
      # failure, never a skip. A failing step prints its failing cases.
      - name: Run full PR-tier battery
        env:
          CHARTER_REQUIRE_EXTERNAL_TOOLS: "1"
        run: tools/battery --no-build

      # Runs whenever the build succeeded, so a failure elsewhere in the battery cannot hide
      # whether the emitted Solidity compiles and the emitted Quint models typecheck.
      - name: Run external-tool differential suite (solc, forge, quint)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/differential-targets-check --require-external-tools
