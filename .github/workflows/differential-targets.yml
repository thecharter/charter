name: Differential Target Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  differential-targets:
    name: Battery + EVM (solc/Foundry), Quint, and Z3 Differential Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Z3 and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 python3 curl git

      - name: Install pinned toolchain via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Foundry (forge) and solc 0.8.24
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install solc binary
        run: |
          sudo curl -L https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -o /usr/local/bin/solc
          sudo chmod +x /usr/local/bin/solc
          solc --version

      - name: Install Quint CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint

      - name: Build Charter and run full PR-tier battery
        run: |
          lake build
          tools/battery --no-build

      - name: Run external-solver differential suite (solc, forge, quint, z3)
        run: |
          tools/differential-targets-check --require-external-tools
