name = "charter"
version = "0.3.0"
defaultTargets = ["Charter", "Examples", "charter"]

# The Charter language, standard library, projections, surface syntax & CLI harness.
[[lean_lib]]
name = "Charter"

# Example institutional programs written in Charter (import Charter, never the reverse).
[[lean_lib]]
name = "Examples"

# The `charter` command-line tool: Charter.Tooling.Cli + the registered examples.
[[lean_exe]]
name = "charter"
root = "Main"
