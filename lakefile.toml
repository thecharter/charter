name = "charter"
version = "0.3.0"
defaultTargets = ["Charter", "Examples", "charter"]

# The Charter language: compiler, semantics, standard library, projections, and CLI (plan §4: src/Charter/).
[[lean_lib]]
name = "Charter"
srcDir = "src"

# Lean companions of the example programs (import Charter, never the reverse).
[[lean_lib]]
name = "Examples"

# The `charter` executable: src/Main.lean over Charter.Cli plus the registered examples.
[[lean_exe]]
name = "charter"
root = "Main"
srcDir = "src"
