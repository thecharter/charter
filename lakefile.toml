name = "charter"
version = "1.0.0"
defaultTargets = ["Charter", "charter", "charter-server"]

# The Charter language: compiler, semantics, standard library, projections, and CLI (src/Charter/).
[[lean_lib]]
name = "Charter"
srcDir = "src"
# Charter.Prove.Kernel imports the elaborator; the generated project imports it, the executable never does.
roots = ["Charter", "Charter.Prove.Kernel"]

# Standalone `charter` compiler & verifier executable (zero linked application companions).
[[lean_exe]]
name = "charter"
root = "Main"
srcDir = "src"

# Operator-blind `charter-server` runtime executable (links Core, Eval, Artifact, Server ONLY).
[[lean_exe]]
name = "charter-server"
root = "Server"
srcDir = "src"
