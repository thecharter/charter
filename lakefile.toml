name = "charter"
version = "0.4.0"
defaultTargets = ["Charter", "charter"]

# The Charter language: compiler, semantics, standard library, projections, and CLI (src/Charter/).
[[lean_lib]]
name = "Charter"
srcDir = "src"
# Charter.Prove.Kernel imports the elaborator; the generated project imports it, the executable never does.
roots = ["Charter", "Charter.Prove.Kernel"]

# Standalone `charter` executable (zero linked application companions).
[[lean_exe]]
name = "charter"
root = "Main"
srcDir = "src"
